services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expense_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense_tracker}
      POSTGRES_DB: ${POSTGRES_DB:-expense_tracker}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expense_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: []
    command: ["pytest"]
    profiles: [ "test" ]

volumes:
  db_data:

[project]
name = "expense-tracker"
version = "0.1.0"
description = "Expense Tracker MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.142",
    "uvicorn[standard]>=0.30,<0.53",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<0.32",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<0.1",
    "pydantic>=2,<3",
    "pydantic-settings>=2.4,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt>=4.0,<4.1",  # passlib 1.7.4's internal bcrypt self-test breaks on bcrypt>=4.1's stricter 72-byte check
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "httpx>=0.27,<0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
